<body>
    <div class="container">

    <script>
        // ===== Mermaid 加载与初始化守护 =====
        async function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src;
                s.async = true;
                /* file:// 下设置 crossOrigin 会导致本地脚本无法加载，仅对 http(s) 使用 */
                if (/^https?:\/\//i.test(src)) {
                    s.crossOrigin = 'anonymous';
                }
                s.onload = () => resolve(true);
                s.onerror = (e) => reject(e);
                document.head.appendChild(s);
            });
        }

        async function ensureMermaid() {
            if (window.mermaid) return true;
            const statusBar = document.getElementById('status-bar');
            try {
                statusBar.textContent = '正在加载 Mermaid...';
                await loadScript('./js/vendor/mermaid.min.js');
                statusBar.textContent = 'Mermaid 已加载';
                return true;
            } catch (e) {
                statusBar.textContent =
                    'Mermaid 加载失败：请确认与「transform-mermaid.html」同目录下存在「js/vendor/mermaid.min.js」且用本地文件方式打开（不要改动文件夹结构）。';
                return false;
            }
        }

        async function ensureKatex() {
            if (window.katex) return true;
            const statusBar = document.getElementById('status-bar');
            try {
                if (statusBar) statusBar.textContent = '正在加载 KaTeX...';
                await loadScript('./js/vendor/katex.min.js');
                if (statusBar) statusBar.textContent = 'KaTeX 已加载';
                return !!window.katex;
            } catch (e) {
                if (statusBar) {
                    statusBar.textContent =
                        'KaTeX 加载失败：请确认「js/vendor/katex.min.js」与「katex.min.css」存在。';
                }
                return false;
            }
        }

        function initMermaid(theme = 'default') {
            if (!window.mermaid) return;
            try {
                window.mermaid.initialize({
                    startOnLoad: false,
                    theme,
                    flowchart: { 
                        useMaxWidth: true, 
                        /* 含 <br/> 的节点依赖 HTML 标签；false 时部分图会只剩空框或看起来像全白 */
                        htmlLabels: true,
                        curve: 'basis',
                        padding: 15,
                        nodeSpacing: 50,
                        rankSpacing: 50
                    },
                    sequence: {
                        diagramMarginX: 50,
                        diagramMarginY: 10,
                        actorMargin: 50,
                        width: 150,
                        height: 65,
                        boxMargin: 10,
                        boxTextMargin: 5,
                        noteMargin: 10,
                        messageMargin: 35,
                        mirrorActors: true,
                        bottomMarginAdj: 1,
                        useMaxWidth: true,
                        rightAngles: false,
                        showSequenceNumbers: false
                    },
                    gantt: {
                        titleTopMargin: 25,
                        barHeight: 20,
                        fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
                        fontSize: 11,
                        gridLineStartPadding: 35,
                        bottomPadding: 25,
                        leftPadding: 75,
                        rightPadding: 75
                    },
                    pie: {
                        textPosition: 0.5
                    },
                    class: {
                        useMaxWidth: true
                    },
                    state: {
                        useMaxWidth: true
                    },
                    er: {
                        useMaxWidth: true
                    },
                    securityLevel: 'loose',
                    /* 子图跨边时内部会打大量 WARN，非错误；'error' 仅输出真正失败信息 */
                    logLevel: 'error',
                    maxTextSize: 10000,
                    fontFamily: '"Helvetica Neue", Helvetica, Arial, sans-serif',
                    // 自定义配色方案，与markdown渲染样式保持一致
                    themeVariables: {
                        primaryColor: '#44bdf7',
                        primaryTextColor: '#333333',
                        primaryBorderColor: '#44bdf7',
                        lineColor: '#44bdf7',
                        secondaryColor: '#f0f9ff',
                        tertiaryColor: '#f8fafc',
                        // 节点样式
                        nodeBkg: '#f0f9ff',
                        nodeBorder: '#44bdf7',
                        clusterBkg: '#f8fafc',
                        clusterBorder: '#e2e8f0',
                        // 默认样式
                        defaultLinkColor: '#44bdf7',
                        titleColor: '#333333',
                        edgeLabelBackground: '#ffffff',
                        // 状态图
                        stateBkg: '#f0f9ff',
                        stateBorder: '#44bdf7',
                        labelBkg: '#ffffff',
                        labelBorder: '#e2e8f0',
                        // 类图
                        classText: '#333333',
                        classBkg: '#f0f9ff',
                        classBorder: '#44bdf7',
                        // 时序图
                        actorBkg: '#f0f9ff',
                        actorBorder: '#44bdf7',
                        actorTextColor: '#333333',
                        actorLineColor: '#44bdf7',
                        signalColor: '#44bdf7',
                        signalTextColor: '#333333',
                        labelBoxBkgColor: '#ffffff',

        // ===== 缩放状态与工具函数 =====
        let currentZoom = 1;
        /** @type {'' | 'width' | 'page'} */
        let autoFitMode = '';

        function setZoom(zIn) {
            const wrapper = document.getElementById('diagram-wrapper');
            if (!wrapper) return;
            let z = Number(zIn);
            if (!Number.isFinite(z) || z <= 0) {
                z = 1;
            }
            currentZoom = Math.max(0.1, Math.min(5, z));
            wrapper.style.zoom = '';
            wrapper.style.transform = `scale(${currentZoom})`;
            wrapper.style.transformOrigin = 'top left';
            const label = document.getElementById('zoom-level');
            if (label) {
                label.textContent = `${Math.round(currentZoom * 100)}%`;
            }
        }

        function resetZoomUI() {
            const wrapper = document.getElementById('diagram-wrapper');
            if (wrapper) {
                wrapper.style.transform = 'none';
                wrapper.style.zoom = '';
            }
            currentZoom = 1;
            const zl = document.getElementById('zoom-level');
            if (zl) zl.textContent = '100%';
        }

        /**
         * @param {'width'|'page'} mode
         * @param {number} [attempt]
         */
        function applyFit(mode, attempt) {
            const n = typeof attempt === 'number' ? attempt : 0;
            const wrapper = document.getElementById('diagram-wrapper');
            const preview = document.getElementById('preview-area');
            if (!wrapper || !preview) return;
            const pw = preview.clientWidth;
            const ph = preview.clientHeight;
            if (pw < 8) {
                if (n < 40) {
                    window.setTimeout(() => applyFit(mode, n + 1), 50);
                } else {
                    setZoom(1);
                }
                return;
            }
            const svg = wrapper.querySelector('svg');
            let contentW = 0;
            let contentH = 0;
            if (svg && svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width > 0) {
                contentW = svg.viewBox.baseVal.width;
                contentH = Math.max(1, svg.viewBox.baseVal.height || 1);
            } else if (svg) {
                const prevWidth = svg.getAttribute('width');
                svg.removeAttribute('width');
                svg.style.width = 'auto';
                const r = svg.getBoundingClientRect();
                contentW = r.width || 0;
                if (prevWidth) svg.setAttribute('width', prevWidth);
                if (!contentW || contentW < 1) contentW = Math.max(1, wrapper.scrollWidth);
                contentH = Math.max(1, r.height || wrapper.scrollHeight);
            } else {
                contentW = Math.max(1, wrapper.scrollWidth);
                contentH = Math.max(1, wrapper.scrollHeight);
            }
            const pad = 24;
            const targetW = Math.max(40, pw - pad);
            const targetH = Math.max(40, ph - pad);
            let z;
            if (mode === 'page') {
                z = Math.min(targetW / Math.max(1, contentW), targetH / Math.max(1, contentH));
            } else {
                z = targetW / Math.max(1, contentW);
            }
            if (!Number.isFinite(z) || z <= 0) z = 1;
            setZoom(Math.min(5, Math.max(0.1, z)));
            autoFitMode = mode === 'page' ? 'page' : 'width';
        }

        function fitToWidth(attempt) {
            applyFit('width', attempt);
        }

        function fitToPage(attempt) {

        function getStandardType(alias) {
            const key = (alias || '').trim();
            return (typeMap[key] || key);
        }

        // 代码分析与建议
        function sanitizeFences(src) {
            const fenceMatch = src.match(/```\s*mermaid\s*\n([\s\S]*?)\n```/i) || src.match(/```\s*\n([\s\S]*?)\n```/i);
            return fenceMatch ? fenceMatch[1] : src;
        }

        function detectType(code) {
            const text = code.trim();
            const firstToken = (text.match(/^([A-Za-z0-9_-]+)/) || [,''])[1];
            const normalized = getStandardType(firstToken);
            if (!firstToken) return 'unknown';
            return normalized || 'unknown';
        }

        function analyzeAndSuggest(raw) {
            let original = sanitizeFences(raw).replace(/\r\n?/g, '\n');
            let code = original.trim();
            const suggestions = [];
            let changed = false;

            // 1) 移除开头的BOM等不可见字符
            const cleanLeading = code.replace(/^\uFEFF/, '');
            if (cleanLeading !== code) { code = cleanLeading; changed = true; suggestions.push('移除不可见字符（BOM）。'); }

            // 从混合的 Markdown 中提取 mermaid 片段
            function extractFromMixed(text) {
                const lines = text.split('\n');
                for (let i = 0; i < lines.length; i++) {
                    const token = (lines[i].match(/^\s*([A-Za-z0-9_-]+)/) || [,''])[1];
                    if (!token) continue;
                    const std = getStandardType(token);
                    if (std && mermaidTypes.includes(token) || std && Object.values(typeMap).includes(std)) {
                        return lines.slice(i).join('\n');
                    }
                }
                return text;
            }

            const mixedExtract = extractFromMixed(original);
            if (mixedExtract.trim() !== code) {
                code = mixedExtract.trim();
                changed = true;
                suggestions.push('检测到包含 Markdown 说明，已自动裁剪到首个图类型行开始的 Mermaid 代码。');
            }

            const type = detectType(code);

            // 2) 缺少图类型声明
            if (type === 'unknown') {
                // 简单启发式判断
                if (/\w+\s*--?>\s*\w+/.test(code)) {
                    code = 'graph TD\n' + code; changed = true; suggestions.push('未检测到图类型，已补充 flowchart: graph TD。');
                } else if (/\bclass\s+\w+|<\|--|--\|>/.test(code)) {
                    code = 'classDiagram\n' + code; changed = true; suggestions.push('未检测到图类型，疑似类图，已补充 classDiagram。');
                }
            }

            // 3) 针对各类型微清洗
            const t = detectType(code);
            if (t === 'flowchart') {
                // graph 无方向
                if (/^graph(?!\s+(TD|TB|BT|RL|LR))\b/m.test(code)) {
                    code = code.replace(/^graph\b/m, 'graph TD');
                    changed = true; suggestions.push('flowchart 未声明方向，已默认使用 TD。');
                }
                // 修复中文节点标签缺少引号的问题
                const chineseNodeRegex = /(\w+)\[([^\[\]]*[\u4e00-\u9fa5][^\[\]]*)\]/g;
                if (chineseNodeRegex.test(code)) {
                    code = code.replace(chineseNodeRegex, (match, id, label) => {
                        if (!label.startsWith('"') && !label.endsWith('"')) {
                            changed = true;
                            return `${id}["${label}"]`;
                        }
                        return match;
                    });
                    if (changed) suggestions.push('为包含中文的节点标签添加了引号。');
                }
                // 修复箭头语法
                if (/--[^>]/.test(code)) {
                    code = code.replace(/--([^>])/g, '-->$1');
                    changed = true; suggestions.push('修复了箭头语法，将 -- 改为 -->。');
                }
            } else if (t === 'class') {
                // 确保第一行是 classDiagram
                if (!/^classDiagram\b/.test(code)) {
                    code = 'classDiagram\n' + code; changed = true; suggestions.push('类图缺少 classDiagram 声明，已补充。');
                }
                // `}class` 紧邻
                if (/}\s*class\s+\w+/.test(code)) {
                    code = code.replace(/}\s*class\s+/g, '}\nclass ');
                    changed = true; suggestions.push('修复了类块 `}` 与下一个 class 紧邻的问题。');
                }
            } else if (t === 'journey') {
                // 中文标题/分节未加引号
                code = code.replace(/^(\s*)title\s+([^"\n]+[\u4e00-\u9fa5][^"\n]*)$/gm, (m, s, txt)=>{ changed=true; suggestions.push('为 journey 的中文标题补充引号。'); return `${s}title "${txt.trim()}"`; });
                code = code.replace(/^(\s*)section\s+([^"\n]+[\u4e00-\u9fa5][^"\n]*)$/gm, (m, s, txt)=>{ changed=true; suggestions.push('为 journey 的中文 section 名称补充引号。'); return `${s}section "${txt.trim()}"`; });
            } else if (t === 'mindmap') {
                // 标准化 mindmap 缩进，避免 "There can be only one root" 错误
                const lines = code.split('\n');
                const firstIdx = lines.findIndex(l => /^\s*mindmap\b/.test(l));
                if (firstIdx >= 0) {
                    // 确保 root 存在
                    let rootIdx = -1;
                    for (let i = firstIdx + 1; i < lines.length; i++) {
                        const line = lines[i];
                        if (!line.trim()) continue;
                        if (/^\s*root\s*\(\(/.test(line)) { rootIdx = i; break; }
                        // 遇到非空且不是 root，说明缺 root
                        break;
                    }
                    if (rootIdx === -1) {
                        lines.splice(firstIdx + 1, 0, '  root((中心主题))');
                        rootIdx = firstIdx + 1;
                        changed = true; suggestions.push('mindmap 缺少 root 节点，已插入 `root((中心主题))`。');
                    }
                    // root 至少两个空格缩进
                    if (!/^\s{2,}root\s*\(\(/.test(lines[rootIdx])) {
                        lines[rootIdx] = lines[rootIdx].replace(/^\s*/, '  ');
                        changed = true; suggestions.push('已为 mindmap 的 root 节点补充标准缩进。');
                    }
                    // root 以下的行全部作为子节点：至少四个空格
                    for (let i = rootIdx + 1; i < lines.length; i++) {
                        const raw = lines[i];
                        if (!raw.trim()) continue;
                        if (/^\s*%%/.test(raw)) continue;
                        if (/^\s*mindmap\b/.test(raw)) break; // 新的图或结束
                        if (!/^\s{4,}/.test(raw)) {
                            lines[i] = '    ' + raw.replace(/^\s*/, '');
                            changed = true;
                        }
                    }
                    code = lines.join('\n');
                    if (changed) suggestions.push('已将 mindmap 的节点缩进标准化，避免多 root/无父节点错误。');
                }
            } else if (t === 'pie') {
                // label 需要引号
                const newCode = code.replace(/^(\s*)([^"\n][^:\n]+)\s*:\s*(\d+)$/gm, (m, s, label, val)=>{
                    if (/^(title|pie)\b/.test(label.trim())) return m; // 跳过声明
                    changed = true; suggestions.push('为 pie 的标签补充引号。');
                    return `${s}"${label.trim()}" : ${val}`;
                });
                code = newCode;
            } else if (t === 'sequenceDiagram') {
                // 修复参与者名称缺少引号的问题
                const participantRegex = /^(\s*)participant\s+([^"\n\s]+)$/gm;
                if (participantRegex.test(code)) {
                    code = code.replace(participantRegex, (match, indent, name) => {
                        if (!name.startsWith('"') && !name.endsWith('"')) {
                            changed = true;
                            return `${indent}participant "${name}"`;
                        }
                        return match;
                    });
                    if (changed) suggestions.push('为时序图的参与者名称添加了引号。');
                }
                // 修复消息箭头语法
                if (/->[^>]/.test(code)) {
                    code = code.replace(/->([^>])/g, '->>$1');
                    changed = true; suggestions.push('修复了时序图箭头语法，将 -> 改为 ->>。');
                }
            } else if (t === 'gantt') {
                // 修复甘特图日期格式
                if (/dateFormat\s+[^Y]/.test(code)) {
                    code = code.replace(/dateFormat\s+[^\n]+/g, 'dateFormat YYYY-MM-DD');
                    changed = true; suggestions.push('修复了甘特图的日期格式为 YYYY-MM-DD。');
                }
                // 修复任务名称缺少引号的问题
                const taskRegex = /^(\s*)([^"\n][^,\n]+)\s*:/gm;
                if (taskRegex.test(code)) {
                    code = code.replace(taskRegex, (match, indent, taskName) => {
                        if (!taskName.startsWith('"') && !taskName.endsWith('"') && !/^(title|dateFormat|section)\b/.test(taskName.trim())) {
                            changed = true;
                            return `${indent}"${taskName.trim()}" :`;
                        }
                        return match;
                    });
                    if (changed) suggestions.push('为甘特图的任务名称添加了引号。');
                }
            } else if (t === 'stateDiagram') {
                // 修复状态图语法
                if (/^stateDiagram(?!\s*-v2)/.test(code)) {
                    code = code.replace(/^stateDiagram/, 'stateDiagram-v2');
                    changed = true; suggestions.push('将状态图更新为 v2 版本。');
                }
            }

            // 5) 运行时支持提醒
            const stdType = detectType(code);
            if (stdType && !officialSupported.has(stdType)) {
                suggestions.push(`注意：当前页面所用 mermaid 版本可能不完全支持 "${stdType}"，请在生产前验证。`);
            }

            // 4) 去除多余反引号
            if (/`/.test(code)) {
                const noTicks = code.replace(/`+/g, '');
                if (noTicks !== code) { code = noTicks; changed = true; suggestions.push('移除了多余的反引号。'); }
            }

            return { fixedCode: code, suggestions, changed };
        }

        function showSuggestions(suggestions, fixedCode) {
            const panel = document.getElementById('suggestion');
            const list = document.getElementById('suggestion-list');
            list.innerHTML = '';
            suggestions.forEach(s => {
                const li = document.createElement('li');

                list.appendChild(li);

            panel.style.display = suggestions.length ? 'block' : 'none';
            window._fixedMermaidCode = fixedCode;

        function hideSuggestions() {
            const panel = document.getElementById('suggestion');

        document.getElementById('apply-fix').addEventListener('click', () => {

        // 示例代码

            svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120">

            latex: `%% format: latex
$$\\int_{-\\infty}^{\\infty} e^{-x^2}\\,dx = \\sqrt{\\pi}$$`
        };

        function stripOptionalMarkdownFence(raw) {
            const t = raw.trim();
            const m = t.match(/^```(\w+)?\s*\n([\s\S]*?)\n```\s*$/);
            if (m) return m[2];
            return raw;
        }

        function parseFormatDirective(code) {
            const lines = code.split('\n');
            if (!lines.length) return { format: null, body: code };
            const first = lines[0].trim();
            let m = first.match(/^%%\s*(format|mode)\s*:\s*(svg|latex|math|mermaid)\s*$/i);
            if (m) {
                return { format: m[2].toLowerCase(), body: lines.slice(1).join('\n') };
            }
            m = first.match(/^%%\s*(svg|latex|math|mermaid)\s*$/i);
            if (m) {
                return { format: m[1].toLowerCase(), body: lines.slice(1).join('\n') };
            }
            return { format: null, body: code };
        }

        function normalizeFormat(f) {
            if (!f) return null;
            const x = String(f).toLowerCase();
            if (x === 'math') return 'latex';
            return x;
        }

        function detectFormat(text) {
            const t = text.trim();
            if (!t) return 'mermaid';
            if (/^<\?xml\s|^<svg[\s>]/i.test(t)) return 'svg';
            if (/^\$\$[\s\S]+?\$\$\s*$/.test(t)) return 'latex';
            if (/^\\\[[\s\S]+\\\]\s*$/.test(t)) return 'latex';
            if (/^\\\([\s\S]+\\\)\s*$/.test(t)) return 'latex';
            if (/^\\begin\{/.test(t)) return 'latex';
            if (/^\$[^$\n][^$\n]*\$\s*$/.test(t) && !t.includes('\n')) return 'latex';
            return 'mermaid';
        }

        function parseLatexForRender(tex) {
            let t = tex.trim();
            let displayMode = false;
            if (t.startsWith('$$') && t.endsWith('$$')) {
                t = t.slice(2, -2).trim();
                displayMode = true;
            } else if (t.startsWith('\\[') && t.endsWith('\\]')) {
                t = t.slice(2, -2).trim();
                displayMode = true;
            } else if (t.startsWith('\\(') && t.endsWith('\\)')) {
                t = t.slice(2, -2).trim();
                displayMode = false;
            } else if (/^\\begin\{/.test(t)) {
                displayMode = true;
            } else if (t.startsWith('$') && t.endsWith('$') && t.length > 2 && !t.startsWith('$$')) {
                t = t.slice(1, -1).trim();
                displayMode = false;
            }
            return { tex: t, displayMode };
        }

        function normalizeSvgEl(svgEl) {
            if (!svgEl) return;
            svgEl.removeAttribute('width');
            svgEl.removeAttribute('height');
            svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            svgEl.style.display = 'block';
            svgEl.style.maxWidth = '100%';
            svgEl.style.width = '100%';
            svgEl.style.height = 'auto';
            if (!svgEl.getAttribute('viewBox')) {
                try {
                    const b = svgEl.getBBox();
                    svgEl.setAttribute('viewBox', `${b.x} ${b.y} ${b.width} ${b.height}`);
                } catch (e) {
                    svgEl.setAttribute('viewBox', '0 0 800 600');
                }
            }
        }

        function injectSvgElement(svgEl, previewArea) {
            const clone = svgEl.cloneNode(true);
            previewArea.innerHTML =
                '<div class="diagram-outer" id="diagram-outer"><div id="diagram-wrapper" class="diagram-wrapper svg-preview-wrap"></div></div>';
            const wrapper = document.getElementById('diagram-wrapper');
            if (wrapper) wrapper.appendChild(clone);
            normalizeSvgEl(wrapper && wrapper.querySelector('svg'));
            resetZoomUI();
        }

        function getSvgRootFromString(code) {
            const trimmed = code.trim();
            const doc = new DOMParser().parseFromString(trimmed, 'image/svg+xml');
            let svg = doc.querySelector('svg');
            const errEl = doc.querySelector('parsererror');
            if (!svg) {
                const htmlDoc = new DOMParser().parseFromString(trimmed, 'text/html');
                svg = htmlDoc.querySelector('svg');
            }
            if (!svg) {
                const msg = errEl ? errEl.textContent : '未找到 <svg> 根元素';
                throw new Error(msg);
            }
            svg.querySelectorAll('script').forEach((el) => el.remove());
            return svg;
        }

        async function renderLatexToPreview(code, previewArea, statusBar) {
            const ok = await ensureKatex();
            if (!ok) {
                previewArea.innerHTML =
                    '<div class="error-message">无法加载 KaTeX（js/vendor/katex.min.js），请检查路径。</div>';
                previewArea.className = 'preview-area error';
                statusBar.textContent = 'KaTeX 未加载';
                return;
            }
            const { tex, displayMode } = parseLatexForRender(code);
            if (!tex) {
                previewArea.innerHTML = '<div class="loading">请输入 LaTeX 数学表达式</div>';
                previewArea.className = 'preview-area';
                statusBar.textContent = '请输入代码';
                return;
            }
            const html = katex.renderToString(tex, {
                displayMode,
                throwOnError: false,
                strict: 'ignore',
                trust: false
            });
            previewArea.innerHTML =
                '<div class="diagram-outer" id="diagram-outer"><div id="diagram-wrapper" class="diagram-wrapper latex-preview-wrap">' +
                html +
                '</div></div>';
            resetZoomUI();
            previewArea.className = 'preview-area';
            statusBar.textContent =
                'KaTeX 渲染成功（数学公式；TikZ/电路宏包等需其它工具链）';
        }

        async function renderMermaidToPreview(code, previewArea, statusBar) {
            const ok = await ensureMermaid();
            if (!ok) {
                previewArea.innerHTML =
                    '<div class="error-message">无法加载 Mermaid 库，请检查「js/vendor/mermaid.min.js」。</div>';
                previewArea.className = 'preview-area error';
                statusBar.textContent = '渲染失败：Mermaid 未加载';
                return;
            }
            initMermaid('default');
            previewArea.innerHTML = '<div class="loading">正在渲染...</div>';
            previewArea.className = 'preview-area';
            statusBar.textContent = '正在渲染...';

            let svgMarkup = null;
            const diagramId = 'mermaid-diagram-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            try {
                const out = await mermaid.render(diagramId, code);
                svgMarkup = out.svg;
            } catch (renderErr) {
                if (typeof mermaid.run === 'function') {
                    const holder = document.createElement('div');
                    holder.className = 'mermaid';
                    holder.textContent = code;
                    holder.setAttribute('data-diagram-id', diagramId);
                    holder.style.cssText = 'position:fixed;left:-99999px;top:0;visibility:hidden;pointer-events:none;';
                    document.body.appendChild(holder);
                    try {
                        await mermaid.run({ nodes: [holder] });
                        const svgNode = holder.querySelector('svg');
                        if (svgNode) {
                            svgMarkup = svgNode.outerHTML;
                        }
                    } finally {
                        holder.remove();
                    }
                }
                if (!svgMarkup) {
                    throw renderErr;
                }
            }

            if (!svgMarkup || String(svgMarkup).trim().length < 10) {
                throw new Error('未生成有效 SVG 内容');
            }

            previewArea.innerHTML =
                '<div class="diagram-outer" id="diagram-outer"><div id="diagram-wrapper" class="diagram-wrapper">' +
                svgMarkup +
                '</div></div>';
            const wrapper = document.getElementById('diagram-wrapper');
            normalizeSvgEl(wrapper ? wrapper.querySelector('svg') : null);
            resetZoomUI();
            previewArea.className = 'preview-area';
            statusBar.textContent = 'Mermaid 渲染成功（可按「适应宽度」或「适应窗口」）';
            autoFitMode = '';
        }

        function getRoutingFromEditor(raw) {
            const afterFence = stripOptionalMarkdownFence(raw);
            const parsed = parseFormatDirective(afterFence);
            const content = stripOptionalMarkdownFence(parsed.body).trim();
            const fmt = normalizeFormat(parsed.format) || detectFormat(content);
            return { format: fmt, content };
        }

        // 渲染图表（Mermaid / 原始 SVG / KaTeX 数学）
        async function renderDiagram() {
            const raw = document.getElementById('mermaid-code').value;
            const previewArea = document.getElementById('preview-area');
            const statusBar = document.getElementById('status-bar');

            if (!raw.trim()) {
                previewArea.innerHTML = '<div class="loading">请输入代码（Mermaid、SVG 或 LaTeX）</div>';
                previewArea.className = 'preview-area';
                statusBar.textContent = '请输入代码';
                hideSuggestions();
                return;
            }

            const { format: fmt, content: routedContent } = getRoutingFromEditor(raw);

            let analysis;
            if (fmt === 'mermaid') {
                analysis = analyzeAndSuggest(routedContent);
            } else {
                analysis = { fixedCode: routedContent, suggestions: [] };
            }
            const code = analysis.fixedCode.trim();

            if (!code) {
                previewArea.innerHTML = '<div class="loading">请输入有效代码</div>';
                previewArea.className = 'preview-area';
                statusBar.textContent = '请输入代码';
                hideSuggestions();
                return;
            }

            if (analysis.suggestions.length) {
                showSuggestions(analysis.suggestions, analysis.fixedCode);
            } else {
                hideSuggestions();
            }

            try {
                if (fmt === 'svg') {
                    const svgRoot = getSvgRootFromString(code);
                    injectSvgElement(svgRoot, previewArea);
                    previewArea.className = 'preview-area';
                    statusBar.textContent = 'SVG 已加载（可按「适应宽度」或「适应窗口」）';
                    autoFitMode = '';
                } else if (fmt === 'latex') {
                    await renderLatexToPreview(code, previewArea, statusBar);
                    autoFitMode = '';
                } else {
                    const detectedType = detectType(code);
                    if (detectedType === 'unknown') {
                        previewArea.innerHTML =
                            '<div class="error-message">未检测到可识别的 Mermaid 图类型。请以 flowchart/graph/sequenceDiagram/gantt/pie/classDiagram 等开头，或使用 ```mermaid 代码块；原始 SVG 与 LaTeX 可用首行 %% format: svg | latex。</div>';
                        previewArea.className = 'preview-area error';
                        statusBar.textContent = '未检测到可识别的图类型';
                        return;
                    }
                    await renderMermaidToPreview(code, previewArea, statusBar);
                }
            } catch (error) {
                console.error('渲染错误:', error);

                let errorMessage = '渲染错误: ' + error.message;
                if (error.message.includes('Parse error')) {
                    errorMessage +=
                        '\n\n建议检查：\n1. 语法是否正确\n2. 节点名称是否包含特殊字符\n3. 是否缺少必要的引号';
                } else if (error.message.includes('Lexical error')) {
                    errorMessage +=
                        '\n\n建议检查：\n1. 是否有未闭合的引号\n2. 是否有无效的字符\n3. 是否有多余的空格或换行';
                }

                previewArea.innerHTML = `<div class="error-message">${errorMessage}</div>`;
                previewArea.className = 'preview-area error';
                statusBar.textContent = `渲染失败: ${error.message}`;
            }
        }

        // 加载示例
        function loadExample(type) {
            const textarea = document.getElementById('mermaid-code');
            textarea.value = examples[type] || '';
            renderDiagram();
        }

        // 清空代码
        function clearCode() {
            document.getElementById('mermaid-code').value = '';
            document.getElementById('preview-area').innerHTML = '<div class="loading">等待输入代码...</div>';
            document.getElementById('preview-area').className = 'preview-area';
            document.getElementById('status-bar').textContent = '准备就绪 - 输入代码并点击渲染按钮';
        }

        // 复制代码
        async function copyCode() {
            const code = document.getElementById('mermaid-code').value;
            if (!code) {
                alert('没有代码可复制');
                return;
            }

            try {
                await navigator.clipboard.writeText(code);
                document.getElementById('status-bar').textContent = '代码已复制到剪贴板';
            } catch (err) {
                // 回退方案
                const textArea = document.createElement('textarea');
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                document.getElementById('status-bar').textContent = '代码已复制到剪贴板';
            }
        }

        // 页面加载：确保 Mermaid 就绪
        window.addEventListener('load', async () => {
            await ensureMermaid();
            initMermaid('default');
            // 自动粘贴剪贴板内容
            try {
                const clipboardText = await navigator.clipboard.readText();
                if (
                    clipboardText &&
                    (clipboardText.includes('graph') ||
                        clipboardText.includes('flowchart') ||
                        clipboardText.includes('sequenceDiagram') ||
                        clipboardText.includes('classDiagram') ||
                        clipboardText.includes('stateDiagram') ||
                        clipboardText.includes('gantt') ||
                        clipboardText.includes('pie') ||
                        clipboardText.includes('mindmap') ||
                        clipboardText.includes('erDiagram') ||
                        /^\s*<\?xml|^<svg[\s>]/i.test(clipboardText.trim()) ||
                        clipboardText.includes('$$') ||
                        /\\begin\{/.test(clipboardText) ||
                        /^\s*%%\s*(format|svg|latex|math|mermaid)/im.test(clipboardText))
                ) {
                    document.getElementById('mermaid-code').value = clipboardText;
                    renderDiagram();
                }
            } catch (err) {
                /* file:// 下剪贴板 API 常不可用，忽略即可 */
            }
        });

        // 监听方向变化（仅 Mermaid flowchart）
        document.getElementById('direction').addEventListener('change', function() {
            const direction = this.value;
            const raw = document.getElementById('mermaid-code').value;
            const { format: fmt } = getRoutingFromEditor(raw);
            if (fmt !== 'mermaid') return;
            const code = document.getElementById('mermaid-code').value;
            if (code && code.includes('graph')) {
                const newCode = code.replace(/graph\s+(TD|TB|BT|RL|LR)/, `graph ${direction}`);
                document.getElementById('mermaid-code').value = newCode;
                renderDiagram();
            }
        });

        // 缩放按钮事件
        document.getElementById('fit-width').addEventListener('click', () => {
            autoFitMode = 'width';
            fitToWidth();
        });
        document.getElementById('fit-page').addEventListener('click', () => {
            autoFitMode = 'page';
            fitToPage();
        });
        document.getElementById('zoom-in').addEventListener('click', () => {
            autoFitMode = '';
            setZoom(currentZoom * 1.2);
        });
        document.getElementById('zoom-out').addEventListener('click', () => {
            autoFitMode = '';
            setZoom(currentZoom / 1.2);
        });
        document.getElementById('zoom-reset').addEventListener('click', () => {
            autoFitMode = '';
            setZoom(1);
        });

        const previewAreaEl = document.getElementById('preview-area');
        previewAreaEl.addEventListener(
            'wheel',
            (e) => {
                if (!e.ctrlKey && !e.metaKey) return;
                e.preventDefault();
                autoFitMode = '';
                const factor = e.deltaY > 0 ? 1 / 1.1 : 1.1;
                setZoom(currentZoom * factor);
            },
            { passive: false }
        );

        document.addEventListener('keydown', (e) => {
            if (!e.ctrlKey && !e.metaKey) return;
            const k = e.key;
            if (k === '0') {
                e.preventDefault();
                autoFitMode = '';
                setZoom(1);
            } else if (k === '=' || k === '+') {
                e.preventDefault();
                autoFitMode = '';
                setZoom(currentZoom * 1.1);
            } else if (k === '-' || k === '_') {
                e.preventDefault();
                autoFitMode = '';
                setZoom(currentZoom / 1.1);
            }
        });

        // 窗口尺寸变化时，若是自适应模式则自动调整
        window.addEventListener('resize', () => {
            if (autoFitMode === 'width') fitToWidth();
            else if (autoFitMode === 'page') fitToPage();
        });

        // 自动渲染（延迟）
        let renderTimeout;
        document.getElementById('mermaid-code').addEventListener('input', function() {
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(renderDiagram, 1000); // 1秒后自动渲染
        });

        // ===== 窗口大小调整功能 =====
        function initResizer() {
            const resizer = document.querySelector('.resizer');
            const leftPanel = document.querySelector('.left-panel');
            const rightPanel = document.querySelector('.right-panel');
            let isResizing = false;
            let startX = 0;
            let startLeftWidth = 0;

            function startResize(e) {
                isResizing = true;
                startX = e.clientX || e.touches[0].clientX;
                startLeftWidth = leftPanel.offsetWidth;
                
                // 添加全局样式防止文本选择
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'ew-resize';
                
                // 防止默认行为
                e.preventDefault();
            }

            function doResize(e) {
                if (!isResizing) return;
                
                const currentX = e.clientX || e.touches[0].clientX;
                const deltaX = currentX - startX;
                const newLeftWidth = startLeftWidth + deltaX;
                
                // 获取容器宽度
                const container = document.querySelector('.container');
                const containerWidth = container.offsetWidth;
                const resizerWidth = resizer.offsetWidth;
                const availableWidth = containerWidth - resizerWidth;
                
                const minLeft = 180;
                const minRight = 200;
                const minLeftWidth = minLeft;
                const maxLeftWidth = Math.max(minLeft, availableWidth - minRight);
                
                // 限制宽度范围
                const clampedWidth = Math.max(minLeftWidth, Math.min(maxLeftWidth, newLeftWidth));
                
                // 应用新宽度
                leftPanel.style.flex = `0 0 ${clampedWidth}px`;
                
                e.preventDefault();
            }

            function stopResize() {
                if (!isResizing) return;
                
                isResizing = false;
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
            }

            // 鼠标事件
            resizer.addEventListener('mousedown', startResize);
            document.addEventListener('mousemove', doResize);
            document.addEventListener('mouseup', stopResize);

            // 触摸事件（移动端支持）
            resizer.addEventListener('touchstart', startResize, { passive: false });
            document.addEventListener('touchmove', doResize, { passive: false });
            document.addEventListener('touchend', stopResize);

            // 防止拖拽时选中文本
            resizer.addEventListener('dragstart', (e) => e.preventDefault());
        }

        // 示例按钮事件监听器
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('example-btn')) {
                const type = e.target.getAttribute('data-type');
                loadExample(type);
            }
        });

        // 页面加载完成后初始化resizer
        window.addEventListener('load', () => {
            initResizer();
        });
    </script>
